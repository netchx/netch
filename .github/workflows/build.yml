name: Netch Build CI
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: windows-2025
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@v6.1.0
        with:
          dotnet-version: '10.0.x'

      - name: Checksum
        shell: pwsh
        run: |
          echo "SOURCE_OTHER_SHA256=$(.\sha256.ps1 .\Other)" | Out-File -Append -Encoding UTF8 -FilePath $Env:GITHUB_ENV
          echo "SOURCE_REDIRECTOR_SHA256=$(.\sha256.ps1 .\Redirector)" | Out-File -Append -Encoding UTF8 -FilePath $Env:GITHUB_ENV
          echo "SOURCE_ROUTEHELPER_SHA256=$(.\sha256.ps1 .\RouteHelper)" | Out-File -Append -Encoding UTF8 -FilePath $Env:GITHUB_ENV

      - name: Cache Other
        uses: actions/cache@v6.1.0
        with:
          key: Netch-windows-2025-Other-${{ env.SOURCE_OTHER_SHA256 }}
          path: |
            .\Other\release

      - name: Cache Redirector
        uses: actions/cache@v6.1.0
        with:
          key: Netch-windows-2025-Redirector-${{ env.SOURCE_REDIRECTOR_SHA256 }}
          path: |
            .\Redirector\bin

      - name: Cache RouteHelper
        uses: actions/cache@v6.1.0
        with:
          key: Netch-windows-2025-RouteHelper-${{ env.SOURCE_ROUTEHELPER_SHA256 }}
          path: |
            .\RouteHelper\bin

      - name: Check Other
        id: check_other
        uses: andstor/file-existence-action@v3.1.0
        with:
          files: Other/release/aiodns.bin, Other/release/pcap2socks.exe, Other/release/tun2socks-windows-amd64-v3.exe, Other/release/wintun.dll, Other/release/xray.exe, Other/release/mihomo.exe
          ignore_case: true

      - name: Setup Go
        uses: actions/setup-go@v7.1.0
        if: steps.check_other.outputs.files_exists == 'false'
        with:
          go-version: stable
          cache-dependency-path: |
            Other/aiodns/go.mod
            Other/aiodns/go.sum

      - name: Setup C++
        id: msys2
        uses: msys2/setup-msys2@v2.33.0
        if: steps.check_other.outputs.files_exists == 'false'
        with:
          msystem: UCRT64
          update: true
          install: mingw-w64-ucrt-x86_64-gcc

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v3

      - name: Build
        shell: pwsh
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          if ($env:MSYS2_LOCATION) {
            $env:PATH = "$(Join-Path $env:MSYS2_LOCATION 'ucrt64/bin');$env:PATH"
          }
          .\build.ps1 -Configuration Release -OutputPath release -UseCache
          if ($LASTEXITCODE -ne 0) { throw 'WinUI self-contained build failed.' }
          .\build.ps1 -Configuration Release -OutputPath release-framework-dependent -SelfContained $false -UseCache
          if ($LASTEXITCODE -ne 0) { throw 'WinUI framework-dependent build failed.' }

      - name: Build RedirectorTester
        shell: pwsh
        run: dotnet build .\RedirectorTester\RedirectorTester.csproj -c Release -p:Platform=x64

      - name: Test
        shell: pwsh
        run: |
          dotnet test .\Tests\Tests.csproj -c Release -p:Platform=x64

      - name: Upload
        uses: actions/upload-artifact@v7.0.2
        with:
          name: release
          path: release

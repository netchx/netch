name: Netch Release CI
on:
  push:
    tags:
      - '[0-9]*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Dry-run package version label (no leading v, e.g. 2.0.0 or 2.0.0-beta1; does not publish a GitHub Release)'
        required: false
        default: ''
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build
    runs-on: windows-2025
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Resolve version
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          $semVerPattern = '^\d+\.\d+\.\d+(?:-[0-9A-Za-z]+(?:\.[0-9A-Za-z]+)*)?$'
          $rawTag = if ($env:EVENT_NAME -eq 'workflow_dispatch' -and -not [string]::IsNullOrWhiteSpace($env:INPUT_VERSION)) {
            $env:INPUT_VERSION.Trim()
          }
          else {
            $env:REF_NAME
          }
          $isSemVer = $rawTag -match $semVerPattern
          if ($env:EVENT_NAME -eq 'push' -and -not $isSemVer) {
            throw "Release tag '$rawTag' must be a SemVer tag without a leading 'v' (for example: 2.0.0 or 2.0.0-beta1)."
          }
          if ($env:EVENT_NAME -eq 'workflow_dispatch' -and -not [string]::IsNullOrWhiteSpace($env:INPUT_VERSION) -and -not $isSemVer) {
            $candidate = $rawTag.TrimStart('v', 'V')
            if ($candidate -match $semVerPattern) {
              $rawTag = $candidate
              $isSemVer = $true
            }
          }
          $releaseTag = $rawTag -replace '[^0-9A-Za-z._-]', '-'
          $buildVersion = if ($isSemVer) { $rawTag } else { '' }
          echo "RELEASE_TAG=$releaseTag" | Out-File -Append -Encoding UTF8 -FilePath $Env:GITHUB_ENV
          echo "BUILD_VERSION=$buildVersion" | Out-File -Append -Encoding UTF8 -FilePath $Env:GITHUB_ENV
          echo "WINUI_SELF_CONTAINED_PACKAGE_NAME=Netch-$releaseTag-winui-x64-self-contained" | Out-File -Append -Encoding UTF8 -FilePath $Env:GITHUB_ENV
          echo "WINUI_FRAMEWORK_DEPENDENT_PACKAGE_NAME=Netch-$releaseTag-winui-x64-framework-dependent" | Out-File -Append -Encoding UTF8 -FilePath $Env:GITHUB_ENV

      - name: Setup .NET
        uses: actions/setup-dotnet@v6.1.0
        with:
          dotnet-version: '10.0.x'

      - name: Checksum
        shell: pwsh
        run: |
          echo "SOURCE_OTHER_SHA256=$(.\sha256.ps1 .\Other)" | Out-File -Append -Encoding UTF8 -FilePath $Env:GITHUB_ENV
          echo "SOURCE_REDIRECTOR_SHA256=$(.\sha256.ps1 .\Redirector)" | Out-File -Append -Encoding UTF8 -FilePath $Env:GITHUB_ENV
          echo "SOURCE_ROUTEHELPER_SHA256=$(.\sha256.ps1 .\RouteHelper)" | Out-File -Append -Encoding UTF8 -FilePath $Env:GITHUB_ENV

      - name: Cache Other
        uses: actions/cache@v6.1.0
        with:
          key: Netch-windows-2025-Other-${{ env.SOURCE_OTHER_SHA256 }}
          path: |
            .\Other\release

      - name: Cache Redirector
        uses: actions/cache@v6.1.0
        with:
          key: Netch-windows-2025-Redirector-${{ env.SOURCE_REDIRECTOR_SHA256 }}
          path: |
            .\Redirector\bin

      - name: Cache RouteHelper
        uses: actions/cache@v6.1.0
        with:
          key: Netch-windows-2025-RouteHelper-${{ env.SOURCE_ROUTEHELPER_SHA256 }}
          path: |
            .\RouteHelper\bin

      - name: Check Other
        id: check_other
        uses: andstor/file-existence-action@v3.1.0
        with:
          files: Other/release/pcap2socks.exe, Other/release/tun2socks-windows-amd64-v3.exe, Other/release/wintun.dll, Other/release/xray.exe, Other/release/mihomo.exe
          ignore_case: true

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v3

      - name: Build
        shell: pwsh
        run: |
          $commonArgs = @{
            Configuration = 'Release'
            UseCache = $true
          }
          if (-not [string]::IsNullOrWhiteSpace($env:BUILD_VERSION)) {
            $commonArgs.Version = $env:BUILD_VERSION
          }
          .\build.ps1 @commonArgs -OutputPath 'release-self-contained' -SelfContained $true
          if ($LASTEXITCODE -ne 0) { throw 'WinUI self-contained build failed.' }
          .\build.ps1 @commonArgs -OutputPath 'release-framework-dependent' -SelfContained $false
          if ($LASTEXITCODE -ne 0) { throw 'WinUI framework-dependent build failed.' }

      - name: Package
        shell: pwsh
        run: |
          $sevenZip = (Get-Command '7z' -ErrorAction SilentlyContinue)?.Source
          if (-not $sevenZip -and (Test-Path 'C:\Program Files\7-Zip\7z.exe')) {
            $sevenZip = 'C:\Program Files\7-Zip\7z.exe'
          }
          if (-not $sevenZip) {
            throw '7z.exe not found on runner.'
          }

          $targets = @(
            @{ Directory = 'release-self-contained'; PackageName = $Env:WINUI_SELF_CONTAINED_PACKAGE_NAME },
            @{ Directory = 'release-framework-dependent'; PackageName = $Env:WINUI_FRAMEWORK_DEPENDENT_PACKAGE_NAME }
          )
          foreach ($target in $targets) {
            $winuiPackage = Join-Path $PWD $target.Directory
            $modeRoot = Join-Path $winuiPackage 'mode'
            $modes = @(Get-ChildItem -LiteralPath $modeRoot -File -Recurse | Where-Object Extension -In '.txt','.json')
            $ids = @($modes.FullName | git hash-object --no-filters --stdin-paths)
            if ($LASTEXITCODE -ne 0 -or $modes.Count -ne $ids.Count) { throw 'Mode manifest generation failed.' }
            $blobs = [ordered]@{}
            for ($i = 0; $i -lt $modes.Count; $i++) {
              $blobs[[IO.Path]::GetRelativePath($modeRoot, $modes[$i].FullName)] = $ids[$i]
            }
            @{ Source='netchx/netch/v2/Storage/mode'; Blobs=$blobs } | ConvertTo-Json -Depth 4 |
              Set-Content -LiteralPath (Join-Path $modeRoot '.manifest.json') -Encoding utf8
            $zipPath = Join-Path $PWD "$($target.PackageName).zip"
            [IO.Compression.ZipFile]::CreateFromDirectory($winuiPackage, $zipPath, [IO.Compression.CompressionLevel]::SmallestSize, $false)

            $sevenZipPath = Join-Path $PWD "$($target.PackageName).7z"
            if (Test-Path -LiteralPath $sevenZipPath) {
              Remove-Item -Force -LiteralPath $sevenZipPath
            }
            Push-Location $winuiPackage
            try {
              & $sevenZip a -t7z -mx=9 -ms=on -bd -- $sevenZipPath *
              if ($LASTEXITCODE -ne 0) { throw "7z packaging failed for $($target.PackageName).7z" }
            }
            finally {
              Pop-Location
            }
            Write-Host "Packaged $($target.PackageName).zip ($([math]::Round((Get-Item -LiteralPath $zipPath).Length / 1MB, 2)) MB) and $($target.PackageName).7z ($([math]::Round((Get-Item -LiteralPath $sevenZipPath).Length / 1MB, 2)) MB)"
          }

      - name: Release notes
        shell: pwsh
        run: |
          # Release body = docs/release-notes/<version>.md (Markdown) + download
          # instructions + SHA256 table. Tag 2.0.0 reads 2.0.0.md.
          $scPkg = $Env:WINUI_SELF_CONTAINED_PACKAGE_NAME
          $fddPkg = $Env:WINUI_FRAMEWORK_DEPENDENT_PACKAGE_NAME
          $version = $Env:RELEASE_TAG.TrimStart('v', 'V')
          $notesFile = Join-Path 'docs\release-notes' "$version.md"

          if (Test-Path $notesFile) {
            $notes = (Get-Content -Path $notesFile -Raw -Encoding UTF8).TrimEnd()
          }
          else {
            Write-Warning "No release notes at $notesFile; linking the README changelog."
            $notes = "## 更新内容 / What's Changed`n`n详见 [README 更新日志](https://github.com/${{ github.repository }}#更新日志) / See the [README changelog](https://github.com/${{ github.repository }}#更新日志) for details."
          }

          $scZipHash = (Get-FileHash "$scPkg.zip" -Algorithm SHA256).Hash.ToLowerInvariant()
          $sc7zHash = (Get-FileHash "$scPkg.7z" -Algorithm SHA256).Hash.ToLowerInvariant()
          $fddZipHash = (Get-FileHash "$fddPkg.zip" -Algorithm SHA256).Hash.ToLowerInvariant()
          $fdd7zHash = (Get-FileHash "$fddPkg.7z" -Algorithm SHA256).Hash.ToLowerInvariant()

          $lines = @(
            $notes
            ''
            '## 下载与启动 / Download & Launch'
            ''
            "- **自带框架版（推荐）**：下载 ``$scPkg.7z``（体积更小，推荐使用，``2.1.1+`` 应用内更新默认使用）或 ``$scPkg.zip``（Windows 原生解压 / 供 ``2.0.0`` 应用内更新），已内置 ``.NET 10`` 与 Windows App SDK 运行时，开箱即用。"
            "- **系统框架版（更轻量）**：下载 ``$fddPkg.7z`` 或 ``$fddPkg.zip``，复用系统 **.NET 10 Runtime (x64)**（仍内置 Windows App SDK）；未安装时请先获取 [.NET 10 Runtime (x64)](https://dotnet.microsoft.com/download/dotnet/10.0)。"
            ''
            '1. 两个版本均为单文件便携包，请完整解压并保留压缩包内的目录结构（包括 `bin/`、`mode/`、`logging/`、`data/` 与 `licenses/`）。'
            '2. 右键 `Netch.App.exe`，选择“以管理员身份运行”。'
            ''
            "- **Self-contained (recommended)**: Download ``$scPkg.7z`` (smaller download, recommended, default for ``2.1.1+`` in-app updates) or ``$scPkg.zip`` (native Windows extraction / in-app updates from ``2.0.0``) with bundled ``.NET 10`` and Windows App SDK runtimes."
            "- **Framework-dependent (lightweight)**: Download ``$fddPkg.7z`` or ``$fddPkg.zip`` to use the system **.NET 10 Runtime (x64)** (Windows App SDK remains bundled); install [.NET 10 Runtime (x64)](https://dotnet.microsoft.com/download/dotnet/10.0) if needed."
            ''
            '1. Both archives are single-file portable bundles; extract the entire archive while preserving its directory layout (`bin/`, `mode/`, `logging/`, `data/`, and `licenses/`).'
            '2. Right-click `Netch.App.exe` and choose **Run as administrator**.'
            ''
            '从要求外置运行时 DLL 的旧版目录版升级时，请手动解压便携包。 / When upgrading from an older directory-based build with external runtime DLLs, extract either portable archive manually.'
            ''
            '## SHA256'
            ''
            '| 文件 / File | SHA256 |'
            '| --- | --- |'
            "| ``$scPkg.zip`` | ``$scZipHash`` |"
            "| ``$fddPkg.zip`` | ``$fddZipHash`` |"
            "| ``$scPkg.7z`` | ``$sc7zHash`` |"
            "| ``$fddPkg.7z`` | ``$fdd7zHash`` |"
            ''
            '[![](https://img.shields.io/badge/Telegram-Channel-blue)](https://t.me/netch_channel) [![](https://img.shields.io/badge/Telegram-Group-green)](https://t.me/netch_group)'
          )

          [System.IO.File]::WriteAllText((Join-Path $PWD 'release-notes.md'), ($lines -join "`n") + "`n", [System.Text.UTF8Encoding]::new($false))
          Get-Content release-notes.md -Encoding UTF8

      - name: Release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3.0.4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          name: ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref, '-') }}
          draft: false
          body_path: release-notes.md
          files: ${{ env.WINUI_SELF_CONTAINED_PACKAGE_NAME }}.zip

      - name: Upload additional release assets
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $extraAssets = @(
            "${{ env.WINUI_SELF_CONTAINED_PACKAGE_NAME }}.7z"
            "${{ env.WINUI_FRAMEWORK_DEPENDENT_PACKAGE_NAME }}.zip"
            "${{ env.WINUI_FRAMEWORK_DEPENDENT_PACKAGE_NAME }}.7z"
          )
          gh release upload "${{ github.ref_name }}" @extraAssets --repo "${{ github.repository }}" --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Uploading additional release assets failed.' }

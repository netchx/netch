name: Netch Release CI
on:
  push:
    tags:
      - '*.*.*'

permissions:
  contents: write

jobs:
  build:
    name: Build
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checksum
        shell: pwsh
        run: |
          echo "SOURCE_NETCH_SHA256=$(.\sha256.ps1 .\Netch)" | Out-File -Append -Encoding UTF8 -FilePath $Env:GITHUB_ENV
          echo "SOURCE_OTHER_SHA256=$(.\sha256.ps1 .\Other)" | Out-File -Append -Encoding UTF8 -FilePath $Env:GITHUB_ENV
          echo "SOURCE_REDIRECTOR_SHA256=$(.\sha256.ps1 .\Redirector)" | Out-File -Append -Encoding UTF8 -FilePath $Env:GITHUB_ENV
          echo "SOURCE_ROUTEHELPER_SHA256=$(.\sha256.ps1 .\RouteHelper)" | Out-File -Append -Encoding UTF8 -FilePath $Env:GITHUB_ENV

      - name: Cache Netch
        uses: actions/cache@v4
        with:
          key: Netch-${{ runner.os }}-Netch-${{ env.SOURCE_NETCH_SHA256 }}
          path: |
            .\Netch\bin

      - name: Cache Redirector
        uses: actions/cache@v4
        with:
          key: Netch-${{ runner.os }}-Redirector-${{ env.SOURCE_REDIRECTOR_SHA256 }}
          path: |
            .\Redirector\bin

      - name: Cache RouteHelper
        uses: actions/cache@v4
        with:
          key: Netch-${{ runner.os }}-RouteHelper-${{ env.SOURCE_ROUTEHELPER_SHA256 }}
          path: |
            .\RouteHelper\bin

      - name: Check Other
        id: check_other
        uses: andstor/file-existence-action@v3
        with:
          files: .\other\release\aiodns.bin

      - name: Setup Go
        uses: actions/setup-go@v5
        if: steps.check_other.outputs.files_exists == 'false'
        with:
          go-version: stable

      - name: Setup C++
        uses: msys2/setup-msys2@v2
        if: steps.check_other.outputs.files_exists == 'false'
        with:
          update: true
          release: true
          install: base-devel git mingw-w64-x86_64-gcc mingw-w64-x86_64-cmake mingw-w64-x86_64-libevent mingw-w64-x86_64-pcre2 mingw-w64-x86_64-freetype mingw-w64-x86_64-libpng mingw-w64-x86_64-bzip2 mingw-w64-x86_64-openssl mingw-w64-x86_64-mbedtls mingw-w64-x86_64-libsodium mingw-w64-x86_64-c-ares mingw-w64-x86_64-boost mingw-w64-x86_64-libmariadbclient unzip p7zip autoconf automake libtool

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build
        shell: pwsh
        run: |
          .\build.ps1 -Configuration Release -OutputPath release -UseCache

      - name: Package
        shell: pwsh
        run: |
          $name = "Netch-${{ github.ref_name }}-win-x64"
          Rename-Item -Path release -NewName Netch
          Compress-Archive -Path Netch -DestinationPath "$name.zip" -CompressionLevel Optimal
          Copy-Item -Path 'Netch\Netch.exe' -Destination "$name.exe"
          echo "PACKAGE_NAME=$name" | Out-File -Append -Encoding UTF8 -FilePath $Env:GITHUB_ENV

      - name: Release notes
        shell: pwsh
        run: |
          # Release body = docs/release-notes/<version>.md (Markdown) + download
          # instructions + SHA256 table. Tag v2.0.1 reads 2.0.1.md.
          $name = $Env:PACKAGE_NAME
          $version = '${{ github.ref_name }}'.TrimStart('v', 'V')
          $notesFile = Join-Path 'docs\release-notes' "$version.md"

          if (Test-Path $notesFile) {
            $notes = (Get-Content -Path $notesFile -Raw -Encoding UTF8).TrimEnd()
          }
          else {
            Write-Warning "No release notes at $notesFile; linking the README changelog."
            $notes = "## 更新内容`n`n详见 [README 更新日志](https://github.com/${{ github.repository }}#更新日志)。"
          }

          $zipHash = (Get-FileHash "$name.zip" -Algorithm SHA256).Hash.ToLowerInvariant()
          $exeHash = (Get-FileHash "$name.exe" -Algorithm SHA256).Hash.ToLowerInvariant()

          $lines = @(
            $notes
            ''
            '## 下载与启动'
            ''
            "1. 下载 ``$name.zip``，解压整个压缩包并保持 ``Netch`` 文件夹内的目录结构。"
            '2. 右键 `Netch.exe`，选择“以管理员身份运行”。'
            ''
            "``$name.exe`` 是单文件程序，只用于替换已有安装中的 ``Netch.exe``；首次使用请下载完整压缩包，其中包含代理核心、tun2socks、Wintun、路由组件和模式文件。"
            ''
            '## SHA256'
            ''
            '| 文件 | SHA256 |'
            '| --- | --- |'
            "| ``$name.zip`` | ``$zipHash`` |"
            "| ``$name.exe`` | ``$exeHash`` |"
            ''
            '[![](https://img.shields.io/badge/Telegram-Channel-blue)](https://t.me/netch_channel) [![](https://img.shields.io/badge/Telegram-Group-green)](https://t.me/netch_group)'
          )

          [System.IO.File]::WriteAllText((Join-Path $PWD 'release-notes.md'), ($lines -join "`n") + "`n", [System.Text.UTF8Encoding]::new($false))
          Get-Content release-notes.md -Encoding UTF8

      - name: Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          name: Netch ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref, '-') }}
          draft: false
          body_path: release-notes.md
          files: |
            ${{ env.PACKAGE_NAME }}.zip
            ${{ env.PACKAGE_NAME }}.exe
